# Dev overlay: `docker compose -f compose.yml -f compose.dev.yml up -d --build`
# (or `just up`). Source bind-mounted for hot reload on both api and web; db
# port published so you can attach a client (psql, a GUI) from the host.

services:
  db:
    ports:
      - "5432:5432"

  api:
    build:
      target: runtime
    command: ["f1-api", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - pitwall-data:/app/data
      - ./python:/app/python
    ports:
      - "8000:8000"

  web:
    build:
      target: build
    command: ["pnpm", "--filter", "@pitwall/web", "dev", "--host", "0.0.0.0", "--port", "5173"]
    working_dir: /repo
    volumes:
      - .:/repo
      # Anonymous volumes: keep the image's own (Linux-built) node_modules
      # rather than letting the bind mount above shadow it with the host's
      # (possibly Windows/macOS-built, possibly absent) node_modules.
      - /repo/node_modules
      - /repo/apps/web/node_modules
      - /repo/apps/web/.svelte-kit
    ports:
      - "5173:5173"
    healthcheck:
      disable: true

  worker:
    volumes:
      - pitwall-data:/app/data
      - ./python:/app/python

  # No proxy in dev — talk to api (8000) and web (5173) directly.
  proxy:
    profiles: ["donotstart"]
