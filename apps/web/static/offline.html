<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<meta name="robots" content="noindex" />
		<title>Offline · FastPitStop</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<style>
			:root {
				--paper: #0b0e13;
				--ink: #e9ecf1;
				--muted: #9aa3b2;
				--rule: #283041;
				--accent: #8f9bff;
			}
			@media (prefers-color-scheme: light) {
				:root:not([data-theme='dark']) {
					--paper: #eeefea;
					--ink: #15181e;
					--muted: #555c68;
					--rule: #cfd2cb;
					--accent: #3340c4;
				}
			}
			:root[data-theme='light'] {
				--paper: #eeefea;
				--ink: #15181e;
				--muted: #555c68;
				--rule: #cfd2cb;
				--accent: #3340c4;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: var(--paper);
				color: var(--ink);
				font:
					400 16px/1.5 system-ui,
					sans-serif;
			}
			main {
				max-width: 30rem;
				padding: 24px 16px;
			}
			.brand {
				font:
					italic 700 24px/1 Georgia,
					serif;
				margin: 0 0 24px;
			}
			h1 {
				font:
					500 22px/1.3 Georgia,
					serif;
				margin: 0 0 8px;
			}
			p {
				margin: 0 0 20px;
				color: var(--muted);
			}
			button {
				min-height: 44px;
				padding: 0 18px;
				border: 1px solid var(--accent);
				border-radius: 8px;
				background: none;
				color: var(--ink);
				font:
					500 15px/1 system-ui,
					sans-serif;
				cursor: pointer;
			}
			small {
				display: block;
				margin-top: 32px;
				color: var(--muted);
				font-size: 12px;
			}
		</style>
		<script>
			try {
				if (localStorage.getItem('theme') === 'light')
					document.documentElement.dataset.theme = 'light';
			} catch {
				// Storage blocked: follow the system theme.
			}
		</script>
	</head>
	<body>
		<main>
			<p class="brand">FastPitStop</p>
			<h1>You’re offline</h1>
			<p>
				Live timing needs a connection. Nothing of the race is kept on this device, so there is
				nothing to show until you’re back online.
			</p>
			<button type="button" onclick="location.reload()">Try again</button>
			<small>Unofficial · not associated with Formula 1</small>
		</main>
	</body>
</html>
