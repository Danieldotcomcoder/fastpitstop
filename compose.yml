# Shared service definitions. Always combined with an override:
#   dev:  docker compose -f compose.yml -f compose.dev.yml  up -d
#   prod: docker compose -f compose.yml -f compose.prod.yml up -d
# (`just up` / `just deploy` wrap these.) No environment VALUES live here —
# everything comes from `.env` (see .env.example), so this file is identical
# in both environments; only compose.dev.yml/compose.prod.yml differ.
#
# One named volume (`pitwall-data`) backs data/{recordings,historical,
# fastf1_cache,radio_audio} — every Python package under python/ already
# resolves those as relative `Path("data/...")` against its CWD, so mounting
# one volume at /app/data (matching the image's WORKDIR) covers all four
# with no extra --out/--cache/--historical-root flags needed. Recordings and
# the radio corpus must live on a volume, never in an image layer or a
# container's writable layer (CLAUDE.md: losing a live recording is losing
# something unrepeatable).

services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pitwall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pitwall}
      POSTGRES_DB: ${POSTGRES_DB:-pitwall}
    volumes:
      - pitwall-pgdata:/var/lib/postgresql/data
    healthcheck:
      # Queries, not just a port check (a listening-but-not-ready Postgres
      # during recovery/startup would pass a bare TCP check).
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pitwall} -d ${POSTGRES_DB:-pitwall} && psql -U ${POSTGRES_USER:-pitwall} -d ${POSTGRES_DB:-pitwall} -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: python/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: ghcr.io/${GHCR_NAMESPACE:-yourname/f1dashboard}/pitwall-api:${IMAGE_TAG:-latest}
    command: ["f1-api", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      F1_STORE_DSN: postgresql://${POSTGRES_USER:-pitwall}:${POSTGRES_PASSWORD:-pitwall}@db:5432/${POSTGRES_DB:-pitwall}
    volumes:
      - pitwall-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: ghcr.io/${GHCR_NAMESPACE:-yourname/f1dashboard}/pitwall-web:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      # Server-side reads (page titles, the sitemap, the landing and archive
      # pages rendered on the server) go straight to the API on the compose
      # network instead of out through the public proxy and back.
      F1_API_INTERNAL_URL: http://api:8000
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: python/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: ghcr.io/${GHCR_NAMESPACE:-yourname/f1dashboard}/pitwall-api:${IMAGE_TAG:-latest}
    # Long-lived by default: the recorder, reconnecting on its own (see
    # f1_ingest.cli). One-shot jobs (backfill, radio fetch/transcribe/index,
    # an ad-hoc migration) run against the SAME image via, e.g.:
    #   docker compose run --rm worker f1-backfill --season 2025
    # --no-auth: FastF1 3.8 asks F1'"'"'s live-timing endpoint for an F1TV token
    # by default (livetiming/client.py -> internals/f1auth.get_auth_token). In
    # a container that prints a browser login URL and blocks forever on a
    # prompt nobody can answer, so the recorder looks "Up" while doing
    # nothing. Unauthenticated is also the posture CLAUDE.md describes (free,
    # unofficial, no account). FastF1'"'"'s own caveat stands: without a token the
    # feed "may only work for some sessions or may only return empty or
    # partial data" -- so treat a thin recording as expected, not a bug.
    # f1-pipeline live, not f1-record: the recorder only writes raw files to
    # disk (Phase 0), so nothing reached Postgres and the dashboard had no
    # live session to show. This records AND ingests, and reads which session
    # it is from the feed rather than being pinned to one race.
    # --batch-size 1: the sink flushes by COUNT only, and every viewer reads
    # the database, so an event not yet flushed is an event nobody sees.
    # 200 looked fine in a race (gap updates fill it in a second or two) but
    # held the 2026 Bahrain GP qualifying 3-4 minutes behind TV: qualifying
    # sends no gap updates, about one event a second.
    command: ["f1-pipeline", "--batch-size", "1", "live", "--no-auth"]
    env_file: .env
    environment:
      F1_STORE_DSN: postgresql://${POSTGRES_USER:-pitwall}:${POSTGRES_PASSWORD:-pitwall}@db:5432/${POSTGRES_DB:-pitwall}
    volumes:
      - pitwall-data:/app/data
    depends_on:
      db:
        condition: service_healthy

  # The live feed withholds car positions from the unauthenticated worker
  # above; F1 publishes them after each session. This imports them for
  # every finished store session (f1_pipeline.archive), so a replay of a
  # race we ingested live draws measured positions like any backfilled
  # one. Idle between sessions: one small query every 10 minutes.
  positions:
    image: ghcr.io/${GHCR_NAMESPACE:-yourname/f1dashboard}/pitwall-api:${IMAGE_TAG:-latest}
    command: ["f1-pipeline", "archive-positions", "--watch", "600"]
    env_file: .env
    environment:
      F1_STORE_DSN: postgresql://${POSTGRES_USER:-pitwall}:${POSTGRES_PASSWORD:-pitwall}@db:5432/${POSTGRES_DB:-pitwall}
    volumes:
      - pitwall-data:/app/data
    depends_on:
      db:
        condition: service_healthy

  # After every live session, what viewers were shown, checked against F1's
  # own archive once it is published (f1_api.post_session): files the
  # session in the backfill (the standings count it), writes a report to
  # data/post_session, and emails (as the watchdog does) when they disagree.
  # Idle between sessions: one small query every 15 minutes.
  postsession:
    image: ghcr.io/${GHCR_NAMESPACE:-yourname/f1dashboard}/pitwall-api:${IMAGE_TAG:-latest}
    command: ["f1-post-session-check", "--watch", "900"]
    env_file: .env
    environment:
      F1_STORE_DSN: postgresql://${POSTGRES_USER:-pitwall}:${POSTGRES_PASSWORD:-pitwall}@db:5432/${POSTGRES_DB:-pitwall}
    volumes:
      - pitwall-data:/app/data
    depends_on:
      db:
        condition: service_healthy

  # A synthetic viewer of every live session: alerts (log, and email when
  # SMTP is configured) when a live stream goes quiet for a minute, the
  # failure that otherwise freezes every dashboard unnoticed. Idle between
  # sessions: one /sessions request every 30 seconds. f1_api.watchdog.
  watchdog:
    image: ghcr.io/${GHCR_NAMESPACE:-yourname/f1dashboard}/pitwall-api:${IMAGE_TAG:-latest}
    command: ["f1-watchdog", "--api", "http://api:8000"]
    env_file: .env
    depends_on:
      - api

  proxy:
    image: caddy:2.10.0
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - pitwall-caddy-data:/data
      - pitwall-caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      - api
      - web

volumes:
  pitwall-pgdata:
  pitwall-data:
  pitwall-caddy-data:
  pitwall-caddy-config:
