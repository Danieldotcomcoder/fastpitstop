# Prod overlay: `docker compose -f compose.yml -f compose.prod.yml up -d`
# (`just deploy` runs this over SSH on the host). No bind mounts (images are
# self-contained, built in CI), no published db port, restart policies,
# resource limits, and log rotation everywhere — a beta with an unknown
# number of users, optimised for "debuggable at 2am" over elasticity.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-resources-small: &resources-small
  limits:
    cpus: "1.0"
    memory: 512M

services:
  db:
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  api:
    restart: unless-stopped
    logging: *default-logging
    environment:
      F1_ENV: production
    deploy:
      resources:
        # NOT *resources-small (512M). The REST reads fit in 512M easily, but
        # `/stream/{key}` drives a LiveKernelSession that recomputes the whole
        # kernel over an accumulating event stream -- measured climbing past
        # 428M on one 2025 race replay before the cgroup OOM killer took the
        # process out mid-stream. The kill leaves no shutdown logs and Docker
        # reports OOMKilled=false (the kernel picks a child, not the container
        # init), so it presents as an unexplained restart loop: the browser
        # sees "Stream ended · 0 drivers" and the race view renders empty.
        # 3G since 2026-10-03: idle sat at 1G, and a race day adds the live
        # session's shared hub plus every concurrent replay's own kernel.
        # The VM has ~5G free; a limit is a cap, not a reservation.
        limits:
          cpus: "2.0"
          memory: 3G

  web:
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources: *resources-small

  worker:
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  # Reading one session's archive loads FastF1's car telemetry alongside the
  # positions (it aligns their clocks together): about a gigabyte at peak.
  positions:
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

  proxy:
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources: *resources-small
