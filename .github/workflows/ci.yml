name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Setup
        run: just setup

      # `just setup` already installs Playwright's Chromium build (needed by
      # verify-phase3), but deliberately without `--with-deps` — that flag
      # apt-installs OS packages, fine on a throwaway CI runner but not
      # something to run unprompted on a developer's own machine. Do that
      # part here instead, CI-only.
      - name: Install Playwright OS dependencies
        run: pnpm --filter @pitwall/web exec playwright install-deps chromium

      - name: Check (lint + typecheck + test + phase verification)
        run: just check

  # Builds and pushes both deploy images to GHCR on every push to main.
  # Deploy itself stays manual (`just deploy`, DEPLOY.md) — a human in the
  # loop during the beta — this job only makes the images available.
  build-and-push:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Build the frontend bundle outside Docker too, purely so the next
      # step can grep the actual output that would ship — the frontend must
      # carry zero secrets in its bundle (CLAUDE.md's deploy prompt).
      - name: Build frontend bundle
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @pitwall/web generate-client
          pnpm --filter @pitwall/web build

      - name: Scan frontend bundle for leaked secrets
        run: |
          set -euo pipefail
          if grep -RE \
            "sk-[A-Za-z0-9]{20,}|ANTHROPIC_API_KEY|F1_SMTP_PASSWORD|F1_TURNSTILE_SECRET|F1_FEEDBACK_IP_SALT|-----BEGIN [A-Z ]*PRIVATE KEY-----" \
            apps/web/build; then
            echo "::error::possible secret found in the built frontend bundle — see matches above"
            exit 1
          fi
          echo "no secret-like patterns found in apps/web/build"

      - name: Compute build metadata
        id: meta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # GHCR image paths must be lowercase; github.repository isn't
          # guaranteed to be (org/repo names are case-preserving on GitHub).
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: python/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/pitwall-api:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ steps.meta.outputs.repo }}/pitwall-api:latest
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: type=gha,scope=pitwall-api
          cache-to: type=gha,mode=max,scope=pitwall-api

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/pitwall-web:${{ steps.meta.outputs.sha }}
            ghcr.io/${{ steps.meta.outputs.repo }}/pitwall-web:latest
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: type=gha,scope=pitwall-web
          cache-to: type=gha,mode=max,scope=pitwall-web
