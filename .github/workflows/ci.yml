# The release gate that needs no F1 data, on every push and pull request, as
# four jobs that run side by side. A deploy (deploy.yml) does not run it
# again: it only checks that this workflow passed for the commit it ships.
#
# Not here, by design (DEPLOY.md, "Deploying from GitHub"):
# - `just verify-real` needs `data/` (real races, gitignored), so it is run
#   on a machine that has it before merging;
# - `just verify-visual` compares against baselines rendered on Windows,
#   which a Linux runner draws differently.
name: CI

on:
  push:
  pull_request:

# A newer push supersedes an older run of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: just lint
      - run: just typecheck
      - run: just test

  phases:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: just verify-phase0 verify-phase1 verify-phase2

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python: 'false'
          web: 'true'
      - run: just web-check
      - run: just web-test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          web: 'true'
          browser: 'true'
      - run: just verify-phase3 verify-phase4 verify-phase5
