# Deploy production from GitHub, started by hand (Actions -> Deploy -> Run
# workflow, on `main`). The same deploy as `just deploy-host`: stream the
# checkout to the VM, build there, bring the stack up, migrate. Setup and the
# secrets it needs: DEPLOY.md, "Deploying from GitHub".
#
# It does not run the tests: CI (ci.yml) already ran them on the push, so
# this only checks that CI passed for the exact commit being shipped, which
# takes seconds. The deploy itself is the build on the VM.
#
# Unlike a deploy from a desktop, it sends no `.env`: the VM keeps its own.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      race_weekend_override:
        description: Deploy even though a Grand Prix weekend is under way (emergencies only)
        type: boolean
        default: false
      skip_ci_check:
        description: Deploy even if CI has not passed for this commit (emergencies only)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# One deploy at a time, and never cancel one half-way through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/pitwall' }}
      SITE: https://fastpitstop.online
    steps:
      - name: CI passed for this commit
        if: ${{ !inputs.skip_ci_check }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$GITHUB_SHA" --event push --limit 1 \
            --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')
          echo "CI for ${GITHUB_SHA::7}: ${state:-no run}"
          if [ "$state" != "completed success" ]; then
            echo "Deploy only a commit CI has passed: wait for CI, or fix it."
            exit 1
          fi

      - uses: actions/checkout@v4

      # Never during a Grand Prix weekend: from 12 hours before its first
      # session to 6 hours after its last. The API's "next" event is the
      # current one while its weekend runs. An API that cannot answer blocks
      # the deploy too; the override exists for exactly that emergency.
      - name: Refuse during a race weekend
        if: ${{ !inputs.race_weekend_override }}
        run: |
          python3 - <<'EOF'
          import json, sys, urllib.request
          from datetime import datetime, timedelta, timezone

          url = "https://fastpitstop.online/api/schedule/next"
          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  event = json.load(response)
          except Exception as error:
              sys.exit(f"Could not read {url} ({error}). Re-run with the override to deploy anyway.")
          if not event or not event.get("sessions"):
              print("No Grand Prix weekend ahead: deploying.")
              sys.exit(0)
          starts = [datetime.fromisoformat(s["start_utc"].replace("Z", "+00:00")) for s in event["sessions"]]
          opens, closes = min(starts) - timedelta(hours=12), max(starts) + timedelta(hours=6)
          now = datetime.now(timezone.utc)
          name = event.get("event_name", "a Grand Prix")
          if opens <= now <= closes:
              sys.exit(f"{name} weekend: no deploys from {opens:%a %d %b %H:%M} to {closes:%a %d %b %H:%M} UTC.")
          print(f"Next weekend is {name}, from {opens:%a %d %b %H:%M} UTC: deploying.")
          EOF

      - name: SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "DEPLOY_HOST secret is not set"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - uses: astral-sh/setup-uv@v6

      - name: Deploy
        run: uv run --no-project --with python-dotenv python deploy/deploy_host.py

      # The deploy waits for every container to report healthy; this checks
      # the site answers from outside too.
      - name: Check the site answers
        run: |
          for path in / /live /api/health /api/sessions; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$SITE$path")
            echo "$path -> $code"
            test "$code" = 200
          done
