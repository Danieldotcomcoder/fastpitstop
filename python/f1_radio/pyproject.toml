[project]
name = "f1-radio"
version = "0.0.1"
description = "Phase 4: acquires team-radio audio referenced by TeamRadioClip events into a local cache, batch-transcribes it via local faster-whisper into radio_transcripts (4.1-4.2), and indexes it with local sentence embeddings + pgvector for semantic/hybrid search, enriched with race context (4.3)."
requires-python = ">=3.12"
dependencies = [
    "f1-domain",
    "f1-backfill",
    "f1-historical-adapter",
    "f1-store",
    "f1-kernel",
    "requests>=2.32",
    "pydantic>=2.7",
    "faster-whisper>=1.0",
    "sentence-transformers>=3.0",
    # Declared explicitly ONLY so the CPU-index pin below binds to it:
    # uv applies [tool.uv.sources] to a package's own declared
    # dependencies, not to transitive ones, and torch would otherwise
    # arrive via sentence-transformers with the whole CUDA stack attached.
    # No version floor -- sentence-transformers still owns that constraint.
    "torch",
]

[project.scripts]
f1-radio = "f1_radio.cli:main"

[tool.uv.sources]
f1-domain = { workspace = true }
f1-backfill = { workspace = true }
f1-historical-adapter = { workspace = true }
f1-store = { workspace = true }
f1-kernel = { workspace = true }
# CPU-only torch. Nothing here runs on a GPU (embeddings are CPU, and
# faster-whisper uses ctranslate2, not torch), and the deployed container
# has no CUDA runtime -- see the pytorch-cpu index note in the root
# pyproject for what this saves.
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_radio"]
