[project]
name = "f1-api"
version = "0.0.1"
description = "Phase 3.1: the FastAPI read model — the only thing the frontend talks to. Bridges the pure-Python kernel/store to the TypeScript frontend over REST + a WebSocket envelope stream."
requires-python = ">=3.12"
dependencies = [
    "f1-domain",
    "f1-kernel",
    "f1-historical-adapter",
    "f1-store",
    "f1-replay",
    "f1-radio",
    "f1-why",
    "f1-backfill",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.5",
]

[project.scripts]
f1-api = "f1_api.cli:main"
f1-watchdog = "f1_api.watchdog:main"
f1-post-session-check = "f1_api.post_session:main"

# httpx (needed for FastAPI's TestClient) lives in the root workspace's dev
# group alongside pytest/hypothesis — the same "shared dev tooling" home
# the root pyproject already uses for cross-cutting test dependencies.

[tool.uv.sources]
f1-domain = { workspace = true }
f1-kernel = { workspace = true }
f1-historical-adapter = { workspace = true }
f1-store = { workspace = true }
f1-replay = { workspace = true }
f1-radio = { workspace = true }
f1-why = { workspace = true }
f1-backfill = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_api"]
