[project]
name = "f1-parse"
version = "0.0.1"
description = "Phase 1 parsing: layer one decodes raw SignalR payloads into typed intermediate data; layer two folds them into session state and emits domain events. No DB."
requires-python = ">=3.12"
dependencies = [
    "f1-recording",
    "f1-domain",
    "pydantic>=2.7",
]

[dependency-groups]
# f1-replay is test-only: the state-machine replay tests drive a synthetic
# recording through the real Phase 0 replay path. It is NOT a runtime dep —
# the pipeline consumes RawRecords without caring where they came from.
dev = [
    "f1-replay",
]

[tool.uv.sources]
f1-recording = { workspace = true }
f1-domain = { workspace = true }
f1-replay = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_parse"]
