[project]
name = "f1-backfill"
version = "0.0.1"
description = "Phase 0: acquires historical data (FastF1 + OpenF1) into clean tables that feed the Phase 2 analytics kernel directly."
requires-python = ">=3.12"
dependencies = [
    "fastf1>=3.7",
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
    "pydantic>=2.7",
]

[project.scripts]
f1-backfill = "f1_backfill.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_backfill"]
