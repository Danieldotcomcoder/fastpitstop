[project]
name = "f1-store"
version = "0.0.1"
description = "Phase 1 persistence: the append-only DomainEvent log plus materialized state tables in TimescaleDB. The DB is a SINK, never a dependency of the transform."
requires-python = ">=3.12"
dependencies = [
    "f1-domain",
    "psycopg[binary]>=3.1",
]

[project.scripts]
f1-store-migrate = "f1_store.cli:main"

[tool.uv.sources]
f1-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_store"]
