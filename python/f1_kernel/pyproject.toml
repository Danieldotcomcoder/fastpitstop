[project]
name = "f1-kernel"
version = "0.0.1"
description = "Phase 2 analytics kernel: typed lap/stint/telemetry frames over the Phase 1 DomainEvent stream, tunable KernelParams, circuit metadata, and the backtest harness every analytic is tested with."
requires-python = ">=3.12"
dependencies = [
    "f1-domain",
    "f1-historical-adapter",
    # [rtcompat]: the default polars wheel is compiled for x86-64-v3 (AVX2,
    # FMA, BMI1/2, LZCNT...) and dies with SIGILL on a CPU without them --
    # which is exactly what a QEMU-generic vCPU exposes, as the deploy VM
    # does. rtcompat dispatches at runtime instead, so one lockfile serves
    # both a modern laptop and an emulated-CPU host. Marginally slower where
    # AVX2 exists; a crash-free API everywhere is worth more than that.
    "polars[rtcompat]>=1.20",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
]

[dependency-groups]
# f1-store is test/optional-only: the kernel reads the event log through it
# when a database is present, but the DB is never a dependency of an
# analytic (CLAUDE.md) and every test runs without one.
dev = [
    "f1-store",
    "f1-pipeline",
    "pandas>=2.2",
    "pyarrow>=17",
]

[tool.uv.sources]
f1-domain = { workspace = true }
f1-historical-adapter = { workspace = true }
f1-store = { workspace = true }
f1-pipeline = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_kernel"]
