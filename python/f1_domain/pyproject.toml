[project]
name = "f1-domain"
version = "0.0.1"
description = "Phase 1: the domain vocabulary - pure pydantic types and enums, zero logic, zero I/O."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_domain"]
