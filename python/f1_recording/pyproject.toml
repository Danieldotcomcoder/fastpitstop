[project]
name = "f1-recording"
version = "0.0.1"
description = "The recording format contract shared by the recorder and the replayer (Phase 0). Raw messages only — no domain parsing."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_recording"]
