[project]
name = "f1-replay"
version = "0.0.1"
description = "Phase 0: replays a recording produced by f1_recording at arbitrary speed."
requires-python = ">=3.12"
dependencies = [
    "f1-recording",
]

[tool.uv.sources]
f1-recording = { workspace = true }

[project.scripts]
f1-replay = "f1_replay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_replay"]
